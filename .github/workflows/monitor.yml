name: GPN fuel monitor

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpn-fuel-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find and unpack bot archive
        shell: bash
        run: |
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Не найден ZIP-архив бота в корне репозитория."
            exit 1
          fi
          echo "Использую архив: $ZIP_FILE"
          rm -rf bot
          mkdir -p bot runtime
          unzip -oq "$ZIP_FILE" -d bot

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Check Gazpromneft map once
        env:
          PYTHONPATH: ${{ github.workspace }}/bot
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_CITY: Каменск-Уральский
          TARGET_LAT: '56.4149'
          TARGET_LON: '61.9187'
          RADIUS_KM: '25'
          FUEL_ALIASES: '95,АИ-95,AI-95,G-95,G95,G-100,G100'
          ALERT_ON_FIRST_SEEN: 'true'
          ALERT_WHEN_AVAILABLE: 'false'
          HEADLESS: 'true'
          STATE_DB: ${{ github.workspace }}/runtime/state.sqlite3
          LOG_FILE: ${{ github.workspace }}/runtime/monitor.log
          LOG_LEVEL: INFO
        run: python -m app.monitor --once

      - name: Monthly keepalive
        if: github.event_name == 'schedule' && github.event.schedule == '17 4 1 * *'
        run: date -u +'%Y-%m-%dT%H:%M:%SZ' > runtime/keepalive.txt

      - name: Save state when changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/state.sqlite3 runtime/keepalive.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'State unchanged.'
          else
            git commit -m 'Update fuel monitor state [skip ci]'
            git push
          fi
