name: Build and push v2

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements.txt
      - app.py
      - .github/workflows/build-push-v2.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker upload
        shell: bash
        run: |
          echo '{"max-concurrent-uploads":1}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken()
            core.setOutput('token', token)
      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken()
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        shell: bash
        run: |
          SA_ID="ajegu838eemcdhtrti60"

          RESPONSE=$(curl -sS \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            -d "audience=${SA_ID}" \
            --data-urlencode "subject_token=${{ steps.oidc.outputs.token }}" \
            -d "subject_token_type=urn:ietf:params:oauth:token-type:id_token" \
            https://auth.yandex.cloud/oauth/token)

          IAM_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$IAM_TOKEN" ]; then
            echo "Yandex token exchange failed:"
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$IAM_TOKEN"
          echo "IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Login to Yandex Container Registry
        shell: bash
        run: |
          echo "$IAM_TOKEN" | docker login \
            --username iam \
            --password-stdin \
            cr.yandex

      - name: Build Docker image
        run: |
          docker build \
            -t cr.yandex/crp6qrgulv058lqii0m6/gpn-fuel-monitor:latest \
            .

          - name: Push Docker image
        shell: bash
        run: |
          IMAGE="cr.yandex/crp6qrgulv058lqii0m6/gpn-fuel-monitor:latest"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"
            timeout 900 docker push "$IMAGE" && exit 0
            echo "Push attempt $attempt failed or timed out"
            sleep 10
          done

          exit 1
